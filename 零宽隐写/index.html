<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>零宽字符隐写 V13</title>
    <link rel="stylesheet" href="/css/core/variables.css" />
    <link rel="stylesheet" href="/css/core/base.css" />
    <link rel="stylesheet" href="/works/零宽隐写/work-style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
</head>
<body>

    <div class="container">
        <!-- ===== 头部 ===== -->
        <div class="tool-header">
            <h1>
                ⚡ 零宽字符隐写
                <small>V13 Optimized</small>
            </h1>
        </div>
        <div class="tool-sub">
            <span>16 种零宽字符 · 4 bit/字符 · 智能压缩策略</span>
            <span class="hint"><i>⏎</i> 双击结果自动填入解码区</span>
        </div>

        <!-- ===== 映射表 ===== -->
        <div class="char-map" id="charMapDisplay">
            <span class="map-label">映射表</span>
            <!-- 由 JS 动态填充 -->
        </div>

        <!-- ===== 编码区 ===== -->
        <div class="section">
            <div class="section-title">
                🔒 编码隐写
                <span class="badge-mode">4-bit</span>
            </div>

            <label for="coverText">掩护文本 (Cover Text)</label>
            <textarea id="coverText" rows="2" placeholder="可选：输入公开可见的文字…"></textarea>

            <label for="secretText">秘密信息 (Secret Message)</label>
            <textarea id="secretText" rows="3" placeholder="输入要隐藏的内容…"></textarea>

            <div class="btn-group">
                <button class="btn btn-primary" id="encodeBtn">开始编码</button>
                <button class="btn btn-outline" id="sampleEncodeBtn">加载示例</button>
                <button class="btn btn-secondary" id="clearEncodeBtn">清空</button>
            </div>

            <div class="result-area" id="encodeResultArea" style="display:none;">
                <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:6px; margin-bottom:10px;">
                    <label style="margin:0; font-weight:600; color:var(--text-color);">编码结果</label>
                    <span id="encodeModeBadge"></span>
                </div>
                <div class="result-box">
                    <textarea id="encodedResult" rows="4" readonly></textarea>
                    <button class="copy-btn" id="copyEncodedBtn">复制</button>
                </div>
                <div class="stats-grid" id="encodeStats"></div>
            </div>
            <div class="error-msg" id="encodeError"></div>
        </div>

        <!-- ===== 解码区 ===== -->
        <div class="section">
            <div class="section-title">
                🔓 解码提取
                <span class="badge-mode">自动识别</span>
            </div>

            <label for="decodeText">待解码文本</label>
            <textarea id="decodeText" rows="4" placeholder="粘贴包含零宽字符的文本…"></textarea>

            <div class="btn-group">
                <button class="btn btn-success" id="decodeBtn">开始解码</button>
                <button class="btn btn-outline" id="sampleDecodeBtn">加载示例</button>
                <button class="btn btn-secondary" id="clearDecodeBtn">清空</button>
            </div>

            <div class="decoded-box" id="decodedResultBox">
                <strong style="color:var(--text-color);">提取结果：</strong>
                <div class="secret-content" id="decodedContent"></div>
                <div class="stats-grid" id="decodeStats" style="margin-top:12px; background:var(--surface-color); border:none; padding:0;"></div>
            </div>
            <div class="error-msg" id="decodeError"></div>
        </div>
    </div>

    <script src="/works/零宽隐写/work-js.js"></script>

</body>
</html>
