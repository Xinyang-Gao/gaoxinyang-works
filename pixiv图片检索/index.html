<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pixiv 图片查询</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        :root {
            color-scheme: dark;

            --bg-color: #101015;
            --surface-color: #17171e;
            --surface-color-secondary: #1d1d26;
            --text-color: #e9ebf0;
            --text-secondary: #a2a6b4;
            --accent-color: #5aa9ff;
            --accent-light: #a3d4ff;
            --accent-dark: #2f7fd9;
            --accent-rgb: 90, 169, 255;
            --border-color: #2c2c37;
            --border-light: #24242e;
            --shadow-color: rgba(0, 0, 0, 0.5);
            --shadow-color-dark: rgba(0, 0, 0, 0.7);
            --shadow-color-offset: rgba(var(--accent-rgb), 0.1);

            --font-display: "Avenir Next", "Futura", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            --font-mono: "SF Mono", "Fira Code", "Consolas", monospace;

            --radius-sm: 6px;
            --radius-md: 10px;
            --radius-lg: 14px;
            --radius-xl: 18px;
            --radius-full: 9999px;

            --shadow-sm: 0 1px 3px var(--shadow-color);
            --shadow-md: 0 6px 18px var(--shadow-color);
            --shadow-lg: 0 16px 32px -8px var(--shadow-color-dark);
            --shadow-offset: 6px 6px 0 -2px var(--shadow-color-offset);
            --shadow-hover: 0 18px 30px -12px var(--shadow-color-dark);

            --transition-fast: 0.2s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            --transition-normal: 0.3s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            --transition-bounce: cubic-bezier(0.34, 1.2, 0.64, 1);

            --container-max-width: 780px;
            --container-padding: 28px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body {
            background-color: var(--bg-color);
            font-family: var(--font-sans);
            font-size: 1rem;
            color: var(--text-color);
            line-height: 1.65;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            transition: background-color 0.5s ease, color 0.5s ease;
        }

        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-color);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: var(--radius-full);
            transition: background var(--transition-fast);
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--accent-color);
        }
        ::-webkit-scrollbar-corner {
            background: var(--bg-color);
        }

        /* ---------- 选中文本 ---------- */
        ::selection {
            background: var(--accent-color);
            color: #fff;
        }

        /* ---------- 焦点环 ---------- */
        :focus-visible {
            outline: none;
            box-shadow: 0 0 0 4px rgba(var(--accent-rgb), 0.18);
            border-radius: var(--radius-sm);
        }

        .container {
            max-width: var(--container-max-width);
            width: 100%;
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-xl);
            box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.03), var(--shadow-md), var(--shadow-offset);
            padding: var(--container-padding);
            transition: background-color var(--transition-normal),
                border-color var(--transition-normal),
                box-shadow var(--transition-normal);
            opacity: 0;
            animation: fadeIn 0.5s ease forwards;
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
            }
        }

        .app-header {
            text-align: center;
            margin-bottom: 24px;
            padding-bottom: 18px;
            border-bottom: 1px solid var(--border-light);
        }

        .app-header .icon-wrap {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 52px;
            height: 52px;
            background: rgba(var(--accent-rgb), 0.12);
            border-radius: var(--radius-md);
            color: var(--accent-color);
            font-size: 1.8rem;
            margin-bottom: 10px;
            transition: transform var(--transition-bounce), background var(--transition-normal);
        }

        .app-header:hover .icon-wrap {
            transform: scale(1.04) rotate(-2deg);
            background: rgba(var(--accent-rgb), 0.18);
        }

        .app-header h1 {
            font-family: var(--font-display);
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: var(--text-color);
            margin: 0 0 4px 0;
        }

        .app-header h1 i {
            color: var(--accent-color);
            margin-right: 6px;
        }

        .app-header .subtitle {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin: 0;
        }

        .search-section {
            margin-bottom: 24px;
        }

        .input-row {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 14px;
        }

        .input-group {
            flex: 1 1 0;
            min-width: 120px;
        }

        .input-group label {
            display: block;
            font-size: 0.78rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }

        .input-group .input-wrap {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-group .input-wrap i {
            position: absolute;
            left: 12px;
            color: var(--text-secondary);
            font-size: 0.9rem;
            opacity: 0.6;
            pointer-events: none;
        }

        .input-group input {
            width: 100%;
            padding: 10px 14px 10px 36px;
            background: var(--surface-color-secondary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            font-family: var(--font-sans);
            font-size: 0.95rem;
            color: var(--text-color);
            transition: border-color var(--transition-fast),
                box-shadow var(--transition-fast),
                background var(--transition-fast);
        }

        .input-group input::placeholder {
            color: var(--text-secondary);
            opacity: 0.6;
        }

        .input-group input:focus {
            outline: none;
            border-color: var(--accent-color);
            background: var(--surface-color);
            box-shadow: 0 0 0 3px rgba(var(--accent-rgb), 0.12);
        }

        .input-group input:hover {
            border-color: var(--accent-light);
        }

        /* ---------- 序号控制（输入框 + 按钮） ---------- */
        .input-group.seq-input {
            flex: 0 1 160px;
            min-width: 140px;
        }

        .seq-control {
            display: flex;
            align-items: center;
            background: var(--surface-color-secondary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 2px;
            transition: border-color var(--transition-fast), box-shadow var(--transition-fast);
        }
        .seq-control:focus-within {
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px rgba(var(--accent-rgb), 0.12);
        }

        .seq-control input {
            width: 48px;
            padding: 8px 2px;
            text-align: center;
            background: transparent;
            border: none;
            color: var(--text-color);
            font-size: 0.95rem;
            -moz-appearance: textfield;
            flex: 1;
        }
        .seq-control input::-webkit-outer-spin-button,
        .seq-control input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        .seq-control input:focus {
            box-shadow: none;
            background: transparent;
        }

        .seq-btn {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            padding: 6px 8px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 0.9rem;
            transition: all var(--transition-fast);
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 30px;
            user-select: none;
        }
        .seq-btn:hover {
            background: rgba(var(--accent-rgb), 0.12);
            color: var(--accent-color);
        }
        .seq-btn:active {
            transform: scale(0.92);
        }
        .seq-btn i {
            font-size: 0.8rem;
        }

        /* ---------- 格式选择 + 查询按钮 ---------- */
        .action-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 16px 20px;
            padding-top: 4px;
        }

        .format-group {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .format-group .format-label {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-secondary);
            letter-spacing: 0.03em;
        }

        .format-option {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            font-size: 0.85rem;
            color: var(--text-secondary);
            transition: color var(--transition-fast);
            user-select: none;
        }

        .format-option:hover {
            color: var(--text-color);
        }

        .format-option input[type="radio"] {
            appearance: none;
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            border: 2px solid var(--border-color);
            border-radius: 50%;
            margin: 0;
            position: relative;
            cursor: pointer;
            transition: border-color var(--transition-fast),
                background var(--transition-fast),
                box-shadow var(--transition-fast);
            flex-shrink: 0;
        }

        .format-option input[type="radio"]:checked {
            border-color: var(--accent-color);
            background: var(--accent-color);
            box-shadow: 0 0 0 2px rgba(var(--accent-rgb), 0.2);
        }

        .format-option input[type="radio"]:checked::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 4px;
            height: 4px;
            background: #fff;
            border-radius: 50%;
        }

        .format-option input[type="radio"]:focus-visible {
            box-shadow: 0 0 0 3px rgba(var(--accent-rgb), 0.2);
        }

        .format-option .ext {
            font-weight: 500;
        }

        /* ---------- 查询按钮 ---------- */
        .btn-query {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 10px 28px;
            background: var(--accent-color);
            color: #fff;
            border: none;
            border-radius: var(--radius-md);
            font-family: var(--font-sans);
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform var(--transition-fast),
                background var(--transition-fast),
                box-shadow var(--transition-fast);
            box-shadow: 0 4px 14px rgba(var(--accent-rgb), 0.25);
            margin-left: auto;
            flex-shrink: 0;
        }

        .btn-query:hover {
            background: var(--accent-dark);
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(var(--accent-rgb), 0.35);
        }

        .btn-query:active {
            transform: scale(0.96);
        }

        .btn-query i {
            font-size: 0.9rem;
        }

        .image-section {
            margin: 18px 0 14px 0;
            border-radius: var(--radius-lg);
            overflow: hidden;
            background: var(--surface-color-secondary);
            border: 1px solid var(--border-color);
            min-height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            transition: border-color var(--transition-normal);
        }

        .image-section .image-wrapper {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .image-section img {
            max-width: 100%;
            max-height: 70vh;
            border-radius: var(--radius-md);
            display: block;
            box-shadow: var(--shadow-sm);
            transition: opacity 0.4s ease, transform 0.4s var(--transition-bounce);
            opacity: 0;
            transform: scale(0.96);
        }

        .image-section img.loaded {
            opacity: 1;
            transform: scale(1);
        }

        .image-section .placeholder {
            color: var(--text-secondary);
            font-size: 0.95rem;
            padding: 32px 20px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .image-section .placeholder i {
            font-size: 2.6rem;
            color: var(--accent-color);
            opacity: 0.4;
        }

        .image-section .placeholder .hint {
            font-size: 0.85rem;
            opacity: 0.7;
        }

        /* 加载状态 */
        .image-section .loading-state {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            padding: 32px 20px;
            color: var(--text-secondary);
        }

        .image-section .loading-state .spinner {
            width: 32px;
            height: 32px;
            border: 3px solid var(--border-color);
            border-top-color: var(--accent-color);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .image-section .loading-state .loading-text {
            font-size: 0.9rem;
        }

        /* 错误状态 */
        .image-section .error-state {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            padding: 32px 20px;
            color: #e05a50;
        }

        .image-section .error-state i {
            font-size: 2.2rem;
            opacity: 0.7;
        }

        .image-section .error-state .error-text {
            font-size: 0.95rem;
            text-align: center;
            max-width: 360px;
        }

        .image-section .error-state .error-detail {
            font-size: 0.8rem;
            color: var(--text-secondary);
            font-family: var(--font-mono);
            word-break: break-all;
            opacity: 0.7;
        }

        .history-section {
            margin: 18px 0 12px 0;
            padding: 14px 0 6px 0;
            border-top: 1px solid var(--border-light);
            transition: opacity var(--transition-normal);
        }

        .history-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
            padding: 0 4px;
        }

        .history-title {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 8px;
            letter-spacing: 0.02em;
        }

        .history-title i {
            color: var(--accent-color);
            opacity: 0.6;
            font-size: 0.9rem;
        }

        .history-title .count {
            font-weight: 400;
            font-size: 0.7rem;
            color: var(--text-secondary);
            opacity: 0.6;
            margin-left: 2px;
        }

        .history-actions {
            display: flex;
            gap: 6px;
        }

        .history-clear {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-size: 0.75rem;
            padding: 4px 10px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: all var(--transition-fast);
            display: flex;
            align-items: center;
            gap: 4px;
            font-family: var(--font-sans);
            opacity: 0.6;
        }

        .history-clear:hover {
            background: rgba(224, 90, 80, 0.12);
            color: #e05a50;
            opacity: 1;
        }

        .history-clear i {
            font-size: 0.7rem;
        }

        /* 历史滚动容器 */
        .history-scroll {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            padding: 4px 4px 12px 4px;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: thin;
        }

        .history-scroll::-webkit-scrollbar {
            height: 4px;
        }
        .history-scroll::-webkit-scrollbar-track {
            background: var(--bg-color);
            border-radius: var(--radius-full);
        }
        .history-scroll::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: var(--radius-full);
        }
        .history-scroll::-webkit-scrollbar-thumb:hover {
            background: var(--accent-color);
        }

        /* 空状态 */
        .history-empty {
            flex: 1;
            text-align: center;
            color: var(--text-secondary);
            font-size: 0.82rem;
            padding: 16px 0;
            opacity: 0.5;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .history-empty i {
            font-size: 1.4rem;
            opacity: 0.4;
            color: var(--accent-color);
        }

        /* 历史卡片 */
        .history-card {
            flex: 0 0 96px;
            width: 96px;
            background: var(--surface-color-secondary);
            border: 2px solid var(--border-color);
            border-radius: var(--radius-md);
            overflow: hidden;
            cursor: pointer;
            transition: all var(--transition-fast);
            position: relative;
            display: flex;
            flex-direction: column;
            box-shadow: var(--shadow-sm);
        }

        .history-card:hover {
            border-color: var(--accent-color);
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
        }

        .history-card:active {
            transform: scale(0.95);
        }

        .history-card.active {
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px rgba(var(--accent-rgb), 0.2), var(--shadow-sm);
        }

        .history-card .thumb-wrap {
            width: 100%;
            height: 72px;
            background: var(--bg-color);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
            flex-shrink: 0;
        }

        .history-card .thumb-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: opacity 0.3s ease;
            display: block;
        }

        .history-card .thumb-wrap img.loaded {
            opacity: 1;
        }

        .history-card .thumb-wrap .thumb-placeholder {
            color: var(--text-secondary);
            font-size: 1.6rem;
            opacity: 0.25;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .history-card .card-info {
            padding: 4px 6px 6px 6px;
            text-align: center;
            font-size: 0.6rem;
            line-height: 1.4;
            color: var(--text-secondary);
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-height: 32px;
            background: rgba(0, 0, 0, 0.2);
        }

        .history-card .card-info .card-pid {
            font-weight: 600;
            color: var(--text-color);
            font-size: 0.65rem;
            letter-spacing: 0.01em;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .history-card .card-info .card-seq {
            font-size: 0.55rem;
            opacity: 0.7;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }

        .history-card .card-info .card-seq i {
            font-size: 0.45rem;
            opacity: 0.5;
        }

        .history-card .card-info .card-format {
            font-size: 0.5rem;
            opacity: 0.5;
            text-transform: uppercase;
            margin-top: 1px;
        }

        /* 卡片删除按钮（悬停显示） */
        .history-card .card-remove {
            position: absolute;
            top: 2px;
            right: 2px;
            background: rgba(0, 0, 0, 0.7);
            border: none;
            color: #e05a50;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 0.5rem;
            opacity: 0;
            transition: opacity var(--transition-fast), transform var(--transition-fast);
            padding: 0;
            backdrop-filter: blur(4px);
        }

        .history-card:hover .card-remove {
            opacity: 0.8;
        }

        .history-card .card-remove:hover {
            opacity: 1;
            transform: scale(1.15);
            background: rgba(224, 90, 80, 0.3);
        }

        .footer-info {
            margin-top: 18px;
            padding-top: 16px;
            border-top: 1px solid var(--border-light);
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 12px 24px;
            font-size: 0.82rem;
            color: var(--text-secondary);
        }

        .footer-info .tips {
            display: flex;
            flex-wrap: wrap;
            gap: 6px 18px;
            justify-content: center;
        }

        .footer-info .tips i {
            color: var(--accent-color);
            opacity: 0.6;
            margin-right: 4px;
            width: 1.1em;
        }

        .footer-info .tips span {
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        @media (max-width: 580px) {
            :root {
                --container-padding: 18px;
            }

            .app-header h1 {
                font-size: 1.4rem;
            }
            .app-header .icon-wrap {
                width: 44px;
                height: 44px;
                font-size: 1.4rem;
            }

            .input-row {
                flex-direction: column;
                gap: 10px;
            }
            .input-group {
                flex: 1 1 auto;
                min-width: unset;
            }
            .input-group.seq-input {
                flex: 1 1 auto;
                min-width: unset;
            }

            .action-row {
                flex-direction: column;
                align-items: stretch;
                gap: 14px;
            }
            .format-group {
                justify-content: center;
            }
            .btn-query {
                margin-left: 0;
                width: 100%;
                padding: 12px;
            }

            .image-section img {
                max-height: 50vh;
            }

            .footer-info {
                flex-direction: column;
                text-align: center;
            }
            .footer-info .tips {
                justify-content: center;
            }

            .history-card {
                flex: 0 0 80px;
                width: 80px;
            }
            .history-card .thumb-wrap {
                height: 60px;
            }
            .history-card .card-info {
                font-size: 0.5rem;
                min-height: 28px;
                padding: 3px 4px 4px 4px;
            }
            .history-card .card-info .card-pid {
                font-size: 0.55rem;
            }
            .history-card .card-info .card-seq {
                font-size: 0.45rem;
            }
        }

        @media (min-width: 581px) and (max-width: 768px) {
            .input-group.seq-input {
                flex: 0 1 160px;
            }
        }

        @media (min-width: 769px) {
            .app-header h1 {
                font-size: 2rem;
            }
            .input-group input {
                padding: 12px 16px 12px 40px;
                font-size: 1rem;
            }
            .btn-query {
                padding: 12px 36px;
                font-size: 1rem;
            }
            .history-card {
                flex: 0 0 110px;
                width: 110px;
            }
            .history-card .thumb-wrap {
                height: 82px;
            }
        }

        /* ---------- 减少动画偏好 ---------- */
        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
                scroll-behavior: auto !important;
            }
        }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            border: 0;
        }
    </style>
</head>
<body>

    <main class="container" role="main">
        <!-- 头部 -->
        <header class="app-header">
            <h1>Pixiv 图片查询</h1>
            <p class="subtitle">输入作品 ID，使用序号切换多图</p>
        </header>

        <!-- 搜索区域 -->
        <section class="search-section" aria-label="图片查询表单">
            <form id="searchForm" autocomplete="off" novalidate>
                <div class="input-row">
                    <!-- 作品 ID -->
                    <div class="input-group">
                        <label for="pidInput"><i class="fas fa-hashtag" style="margin-right:4px;"></i> 作品 ID</label>
                        <div class="input-wrap">
                            <i class="fas fa-fingerprint"></i>
                            <input
                            type="text"
                            id="pidInput"
                            placeholder="例如 148383264"
                            required
                            autofocus
                            />
                        </div>
                    </div>

                    <!-- 图片序号（含切换按钮） -->
                    <div class="input-group seq-input">
                        <label for="seqInput"><i class="fas fa-layer-group"></i> 第几张</label>
                        <div class="seq-control">
                            <button type="button" class="seq-btn" id="seqDec" aria-label="上一张">
                                <i class="fas fa-chevron-left"></i>
                            </button>
                            <input
                            type="number"
                            id="seqInput"
                            placeholder="1"
                            min="1"
                            step="1"
                            value="1"
                            />
                            <button type="button" class="seq-btn" id="seqInc" aria-label="下一张">
                                <i class="fas fa-chevron-right"></i>
                            </button>
                        </div>
                    </div>
                </div>

                <div class="action-row">
                    <!-- 图片格式 -->
                    <div class="format-group" role="radiogroup" aria-label="图片格式">
                        <span class="format-label"><i class="far fa-file-image"></i> 格式</span>
                        <label class="format-option">
                            <input type="radio" name="imgFormat" value="png" checked />
                            <span class="ext">png</span>
                        </label>
                        <label class="format-option">
                            <input type="radio" name="imgFormat" value="jpg" />
                            <span class="ext">jpg</span>
                        </label>
                        <label class="format-option">
                            <input type="radio" name="imgFormat" value="gif" />
                            <span class="ext">gif</span>
                        </label>
                    </div>

                    <button type="submit" class="btn-query" id="queryBtn">
                        <i class="fas fa-search"></i> 查询
                    </button>
                </div>
            </form>
        </section>

        <!-- 图片展示 -->
        <section class="image-section" id="imageSection" aria-label="图片展示">
            <!-- 占位 -->
            <div class="placeholder" id="placeholder">
                <i class="fas fa-image"></i>
                <span>输入作品 ID 后点击查询</span>
                <span class="hint">支持 png / jpg / gif 格式</span>
            </div>

            <!-- 加载中 -->
            <div class="loading-state" id="loadingState">
                <div class="spinner" role="status"></div>
                <span class="loading-text">加载中…</span>
            </div>

            <!-- 错误 -->
            <div class="error-state" id="errorState">
                <i class="fas fa-exclamation-triangle"></i>
                <span class="error-text" id="errorText">图片加载失败</span>
                <span class="error-detail" id="errorDetail"></span>
            </div>

            <!-- 图片 -->
            <div class="image-wrapper" id="imageWrapper" style="display:none;">
                <img id="resultImage" src="" alt="Pixiv 图片" />
            </div>
        </section>

        <!-- ==========================================
        历史记录窗格 (新增)
        ========================================== -->
        <section class="history-section" id="historySection" aria-label="历史记录">
            <div class="history-header">
                <span class="history-title">
                    <i class="fas fa-clock-rotate-left"></i> 历史记录
                    <span class="count" id="historyCount">(0)</span>
                </span>
                <div class="history-actions">
                    <button type="button" class="history-clear" id="clearHistory" title="清空所有历史记录">
                        <i class="fas fa-trash-alt"></i> 清空
                    </button>
                </div>
            </div>
            <div class="history-scroll" id="historyScroll">
                <!-- 空状态 -->
                <div class="history-empty" id="historyEmpty">
                    <i class="fas fa-images"></i>
                    <span>暂无历史记录</span>
                    <span style="font-size:0.7rem;opacity:0.6;">查询图片后将自动记录</span>
                </div>
                <!-- 动态卡片由 JS 渲染 -->
            </div>
        </section>

        <!-- 底部信息 -->
        <footer class="footer-info">
            <div class="tips">
                <span><i class="fas fa-info-circle"></i> 多图作品使用序号切换</span>
                <span><i class="fas fa-code"></i> 服务: pixiv.re</span>
                <span><i class="fas fa-clock"></i> 历史记录保存最近 20 张</span>
            </div>
        </footer>
    </main>

    <script>
        (function() {
            'use strict';

            const form = document.getElementById('searchForm');
            const pidInput = document.getElementById('pidInput');
            const seqInput = document.getElementById('seqInput');
            const queryBtn = document.getElementById('queryBtn');
            const placeholder = document.getElementById('placeholder');
            const loadingState = document.getElementById('loadingState');
            const errorState = document.getElementById('errorState');
            const errorText = document.getElementById('errorText');
            const errorDetail = document.getElementById('errorDetail');
            const imageWrapper = document.getElementById('imageWrapper');
            const resultImage = document.getElementById('resultImage');

            // 历史记录 DOM
            const historyScroll = document.getElementById('historyScroll');
            const historyEmpty = document.getElementById('historyEmpty');
            const historyCount = document.getElementById('historyCount');
            const clearHistoryBtn = document.getElementById('clearHistory');

            let historyItems = [];
            const MAX_HISTORY = 20;
            let currentDisplayKey = ''; // 用于高亮当前显示的图片

            function getSelectedFormat() {
                const radios = document.querySelectorAll('input[name="imgFormat"]');
                for (const r of radios) {
                    if (r.checked) return r.value;
                }
                return 'png';
            }

            function generateKey(pid, seq) {
                return pid + '|' + seq;
            }

            function resetStates() {
                placeholder.style.display = 'flex';
                loadingState.style.display = 'none';
                errorState.style.display = 'none';
                imageWrapper.style.display = 'none';
                resultImage.classList.remove('loaded');
                resultImage.src = '';
                resultImage.alt = '';
            }

            function showLoading() {
                placeholder.style.display = 'none';
                loadingState.style.display = 'flex';
                errorState.style.display = 'none';
                imageWrapper.style.display = 'none';
            }

            function showError(message, detail) {
                placeholder.style.display = 'none';
                loadingState.style.display = 'none';
                errorState.style.display = 'flex';
                imageWrapper.style.display = 'none';
                errorText.textContent = message || '图片加载失败';
                errorDetail.textContent = detail || '';
            }

            function showImage(src) {
                placeholder.style.display = 'none';
                loadingState.style.display = 'none';
                errorState.style.display = 'none';
                imageWrapper.style.display = 'flex';

                resultImage.classList.remove('loaded');
                resultImage.alt = 'Pixiv 图片';

                const img = resultImage;
                img.src = src;

                img.onload = function() {
                    img.classList.add('loaded');
                };

                img.onerror = function() {
                    if (!img.complete || img.naturalWidth === 0) {
                        showError('图片加载失败', '请检查作品 ID 和序号是否正确');
                    }
                };

                if (img.complete && img.naturalWidth > 0) {
                    img.classList.add('loaded');
                }
            }

            function addHistory(pid, seq, format, url) {
                const key = generateKey(pid, seq);

                // 如果已存在，更新并移到最前面
                const existingIndex = historyItems.findIndex(item => item.key === key);
                if (existingIndex !== -1) {
                    const item = historyItems[existingIndex];
                    item.format = format;
                    item.url = url;
                    item.timestamp = Date.now();
                    // 移到最前面
                    historyItems.splice(existingIndex, 1);
                    historyItems.unshift(item);
                } else {
                    // 新增
                    const newItem = {
                        key: key,
                        pid: pid,
                        seq: seq,
                        format: format,
                        url: url,
                        timestamp: Date.now()
                    };
                    historyItems.unshift(newItem);

                    // 超过最大数量，移除最旧的
                    if (historyItems.length > MAX_HISTORY) {
                        historyItems.pop();
                    }
                }

                // 更新当前显示标识
                currentDisplayKey = key;

                renderHistory();
            }

            function removeHistoryItem(key) {
                historyItems = historyItems.filter(item => item.key !== key);
                if (currentDisplayKey === key) {
                    currentDisplayKey = '';
                }
                renderHistory();
            }

            function clearAllHistory() {
                historyItems = [];
                currentDisplayKey = '';
                renderHistory();
            }

            function renderHistory() {
                // 清空滚动容器（保留空状态元素）
                const cards = historyScroll.querySelectorAll('.history-card');
                cards.forEach(el => el.remove());

                // 更新计数
                historyCount.textContent = '(' + historyItems.length + ')';

                // 显示/隐藏空状态
                if (historyItems.length === 0) {
                    historyEmpty.style.display = 'flex';
                } else {
                    historyEmpty.style.display = 'none';
                }

                // 渲染卡片
                historyItems.forEach((item, index) => {
                    const card = document.createElement('div');
                    card.className = 'history-card';
                    if (item.key === currentDisplayKey) {
                        card.classList.add('active');
                    }
                    card.dataset.key = item.key;
                    card.dataset.index = index;

                    // 缩略图区域
                    const thumbWrap = document.createElement('div');
                    thumbWrap.className = 'thumb-wrap';

                    const img = document.createElement('img');
                    img.src = item.url;
                    img.alt = 'PID: ' + item.pid + ' #' + item.seq;
                    img.loading = 'lazy';
                    img.onload = function() {
                        img.classList.add('loaded');
                    };
                    img.onerror = function() {
                        // 加载失败显示占位
                        img.style.display = 'none';
                        const placeholderIcon = document.createElement('i');
                        placeholderIcon.className = 'fas fa-image thumb-placeholder';
                        thumbWrap.appendChild(placeholderIcon);
                    };
                    thumbWrap.appendChild(img);

                    // 信息区域
                    const info = document.createElement('div');
                    info.className = 'card-info';

                    const pidSpan = document.createElement('div');
                    pidSpan.className = 'card-pid';
                    pidSpan.textContent = item.pid;

                    const seqSpan = document.createElement('div');
                    seqSpan.className = 'card-seq';
                    seqSpan.innerHTML = '<i class="fas fa-layer-group"></i> #' + item.seq;

                    const formatSpan = document.createElement('div');
                    formatSpan.className = 'card-format';
                    formatSpan.textContent = item.format;

                    info.appendChild(pidSpan);
                    info.appendChild(seqSpan);
                    info.appendChild(formatSpan);

                    // 删除按钮
                    const removeBtn = document.createElement('button');
                    removeBtn.className = 'card-remove';
                    removeBtn.innerHTML = '<i class="fas fa-times"></i>';
                    removeBtn.setAttribute('aria-label', '移除历史记录');
                    removeBtn.title = '移除这条记录';
                    removeBtn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        removeHistoryItem(item.key);
                    });

                    card.appendChild(thumbWrap);
                    card.appendChild(info);
                    card.appendChild(removeBtn);

                    // 点击卡片加载图片
                    card.addEventListener('click', function() {
                        // 更新输入框
                        pidInput.value = item.pid;
                        seqInput.value = item.seq;
                        // 更新格式
                        const radios = document.querySelectorAll('input[name="imgFormat"]');
                        for (const r of radios) {
                            if (r.value === item.format) {
                                r.checked = true;
                                break;
                            }
                        }
                        // 执行查询
                        performQuery(true);
                    });

                    historyScroll.appendChild(card);
                });

                // 滚动到最前面（最新）
                if (historyItems.length > 0) {
                    historyScroll.scrollLeft = 0;
                }
            }

            let isLoading = false;

            function performQuery(fromHistory) {
                if (isLoading) return;
                isLoading = true;

                const pid = pidInput.value.trim();
                if (!pid) {
                    pidInput.focus();
                    pidInput.style.borderColor = '#e05a50';
                    setTimeout(() => {
                        pidInput.style.borderColor = '';
                    }, 1200);
                    isLoading = false;
                    return;
                }

                let seq = parseInt(seqInput.value, 10);
                if (isNaN(seq) || seq < 1) {
                    seq = 1;
                    seqInput.value = 1;
                }

                const format = getSelectedFormat();
                let pidPart = pid;
                if (seq > 1) {
                    pidPart = pid + '-' + seq;
                }

                const url = 'https://pixiv.re/' + pidPart + '.' + format;

                // 如果不是从历史记录点击的，清除高亮
                if (!fromHistory) {
                    currentDisplayKey = '';
                }

                showLoading();

                const testImg = new Image();
                let loaded = false;
                let timeoutId = null;

                const cleanup = function() {
                    if (timeoutId) {
                        clearTimeout(timeoutId);
                        timeoutId = null;
                    }
                    testImg.onload = null;
                    testImg.onerror = null;
                };

                testImg.onload = function() {
                    if (loaded) return;
                    loaded = true;
                    cleanup();
                    showImage(url);
                    // 添加到历史记录（如果不是从历史记录点击的，或者是从历史记录点击但key不同）
                    if (!fromHistory || (fromHistory && generateKey(pid, seq) !== currentDisplayKey)) {
                        addHistory(pid, seq, format, url);
                    } else {
                        // 从历史记录点击，更新高亮
                        currentDisplayKey = generateKey(pid, seq);
                        renderHistory();
                    }
                    isLoading = false;
                };

                testImg.onerror = function() {
                    if (loaded) return;
                    loaded = true;
                    cleanup();
                    const detail = pidPart + '.' + format;
                    showError('未找到图片', '请确认作品 ID 存在，且序号和格式正确');
                    isLoading = false;
                };

                timeoutId = setTimeout(function() {
                    if (loaded) return;
                    loaded = true;
                    cleanup();
                    showError('请求超时', '请检查网络连接后重试');
                    isLoading = false;
                }, 15000);

                testImg.src = url;

                if (testImg.complete && testImg.naturalWidth > 0) {
                    if (!loaded) {
                        loaded = true;
                        cleanup();
                        showImage(url);
                        if (!fromHistory || (fromHistory && generateKey(pid, seq) !== currentDisplayKey)) {
                            addHistory(pid, seq, format, url);
                        } else {
                            currentDisplayKey = generateKey(pid, seq);
                            renderHistory();
                        }
                        isLoading = false;
                    }
                }
            }

            // 表单提交
            form.addEventListener('submit', function(e) {
                e.preventDefault();
                performQuery(false);
            });

            // 输入框回车
            pidInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    performQuery(false);
                }
            });
            seqInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    performQuery(false);
                }
            });

            // 查询按钮
            queryBtn.addEventListener('click', function(e) {
                e.preventDefault();
                performQuery(false);
            });

            // 序号增减按钮
            document.getElementById('seqDec').addEventListener('click', function() {
                let val = parseInt(seqInput.value, 10) || 1;
                if (val > 1) val--;
                seqInput.value = val;
                performQuery(false);
            });

            document.getElementById('seqInc').addEventListener('click', function() {
                let val = parseInt(seqInput.value, 10) || 1;
                val++;
                seqInput.value = val;
                performQuery(false);
            });

            pidInput.addEventListener('blur', function() {
                const val = pidInput.value.trim();
                if (val.includes('-')) {
                    const parts = val.split('-');
                    if (parts.length === 2) {
                        const pidPart = parts[0].trim();
                        const seqPart = parts[1].trim();
                        if (pidPart && seqPart && /^\d+$/.test(seqPart)) {
                            pidInput.value = pidPart;
                            seqInput.value = parseInt(seqPart, 10);
                            performQuery(false);
                        }
                    }
                }
            });

            // 清空历史记录
            clearHistoryBtn.addEventListener('click', function() {
                if (historyItems.length === 0) return;
                if (confirm('确定要清空所有历史记录吗？')) {
                    clearAllHistory();
                }
            });

            renderHistory();

            window.__pixiv = {
                history: historyItems,
                addHistory: addHistory,
                clearHistory: clearAllHistory,
                renderHistory: renderHistory
            };

        })();
    </script>

</body>
</html>
