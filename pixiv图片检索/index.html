<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pixiv 图集</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
        color-scheme: dark;
        --bg: #0e0e13;
        --surface: #16161d;
        --surface-2: #1c1c25;
        --text: #e9ebf0;
        --dim: #9a9ead;
        --accent: #5aa9ff;
        --accent-dark: #3c86e0;
        --accent-rgb: 90, 169, 255;
        --border: #2a2a35;
        --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    }

    html { -webkit-font-smoothing: antialiased; }

    body {
        min-height: 100vh;
        padding: 32px 18px 64px;
        background: var(--bg);
        background-image: radial-gradient(1100px 520px at 50% -12%,
                          rgba(var(--accent-rgb), .10), transparent 70%);
        color: var(--text);
        font-family: var(--font);
        font-size: 15px;
        line-height: 1.6;
    }

    ::selection { background: var(--accent); color: #fff; }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #2e2e3a; border-radius: 99px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--accent); }

    .container { max-width: 980px; margin: 0 auto; }

    /* ---------- 头部 ---------- */
    .app-header {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        margin-bottom: 22px;
    }

    .icon-wrap {
        width: 42px; height: 42px;
        display: grid; place-items: center;
        border-radius: 12px;
        background: rgba(var(--accent-rgb), .14);
        color: var(--accent);
        font-size: 1.15rem;
        transition: transform .3s cubic-bezier(.34,1.4,.64,1);
    }
    .app-header:hover .icon-wrap { transform: rotate(-6deg) scale(1.05); }

    .app-header h1 {
        font-size: 1.5rem;
        font-weight: 700;
        letter-spacing: -.02em;
    }

    /* ---------- 搜索栏 ---------- */
    .search-bar {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 10px;
        padding: 10px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 16px;
        box-shadow: 0 12px 34px -20px rgba(0, 0, 0, .95);
    }

    .input-wrap {
        position: relative;
        display: flex;
        align-items: center;
        flex: 1 1 220px;
        min-width: 0;
    }
    .input-wrap i {
        position: absolute;
        left: 14px;
        font-size: .85rem;
        color: var(--dim);
        pointer-events: none;
    }

    #pidInput {
        width: 100%;
        padding: 11px 14px 11px 38px;
        background: var(--surface-2);
        border: 1px solid transparent;
        border-radius: 10px;
        color: var(--text);
        font-family: inherit;
        font-size: .95rem;
        transition: border-color .2s, box-shadow .2s;
    }
    #pidInput::placeholder { color: #62667a; }
    #pidInput:focus {
        outline: none;
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(var(--accent-rgb), .15);
    }

    @keyframes shake {
        10%, 90% { transform: translateX(-1px); }
        20%, 80% { transform: translateX(2px); }
        30%, 50%, 70% { transform: translateX(-4px); }
        40%, 60% { transform: translateX(4px); }
    }
    .shake { animation: shake .45s both; }

    .format-group {
        display: flex;
        gap: 2px;
        padding: 3px;
        background: var(--surface-2);
        border-radius: 10px;
        flex-shrink: 0;
    }
    .format-option input {
        position: absolute;
        opacity: 0;
        width: 0; height: 0;
    }
    .format-option span {
        display: block;
        padding: 7px 13px;
        border-radius: 8px;
        font-size: .78rem;
        font-weight: 600;
        letter-spacing: .05em;
        text-transform: uppercase;
        color: var(--dim);
        cursor: pointer;
        user-select: none;
        transition: background .2s, color .2s;
    }
    .format-option:hover span { color: var(--text); }
    .format-option input:checked + span {
        background: rgba(var(--accent-rgb), .18);
        color: var(--accent);
    }
    .format-option input:focus-visible + span {
        box-shadow: 0 0 0 3px rgba(var(--accent-rgb), .3);
    }

    .btn-query {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        padding: 11px 22px;
        border: none;
        border-radius: 10px;
        background: var(--accent);
        color: #fff;
        font-family: inherit;
        font-size: .9rem;
        font-weight: 600;
        cursor: pointer;
        flex-shrink: 0;
        box-shadow: 0 8px 20px -8px rgba(var(--accent-rgb), .8);
        transition: transform .15s, background .2s;
    }
    .btn-query:hover { background: var(--accent-dark); transform: translateY(-1px); }
    .btn-query:active { transform: scale(.97); }
    .btn-query:disabled { opacity: .5; cursor: not-allowed; transform: none; }

    /* ---------- 舞台 ---------- */
    .stage {
        margin-top: 18px;
        min-height: 170px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 18px;
        overflow: hidden;
    }

    .placeholder,
    .loading-state,
    .error-state {
        min-height: 200px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        padding: 40px 20px;
        text-align: center;
        font-size: .88rem;
        color: var(--dim);
    }
    .placeholder i {
        font-size: 2.2rem;
        color: var(--accent);
        opacity: .35;
    }
    .error-state { color: #e0605a; }
    .error-state i { font-size: 1.9rem; }

    .spinner {
        width: 30px; height: 30px;
        border: 3px solid rgba(var(--accent-rgb), .18);
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: spin .75s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ---------- 画廊 ---------- */
    .gallery-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px 14px;
        border-bottom: 1px solid var(--border);
        font-size: .8rem;
        color: var(--dim);
    }

    .btn-ghost {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 6px 12px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: transparent;
        color: var(--text);
        font-family: inherit;
        font-size: .78rem;
        cursor: pointer;
        transition: .2s;
    }
    .btn-ghost:hover {
        border-color: var(--accent);
        color: var(--accent);
        background: rgba(var(--accent-rgb), .08);
    }

    .grid {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        padding: 10px;
    }
    .col {
        flex: 1 1 0;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 10px;
    }

    .card {
        position: relative;
        border-radius: 12px;
        overflow: hidden;
        background: #0b0b10;
        cursor: zoom-in;
        animation: cardIn .35s ease both;
    }
    @keyframes cardIn {
        from { opacity: 0; transform: translateY(8px); }
        to   { opacity: 1; transform: none; }
    }

    .card img {
        display: block;
        width: 100%;
        height: auto;
        min-height: 70px;
        opacity: 0;
        transition: opacity .35s ease, transform .35s ease;
    }
    .card img.loaded { opacity: 1; }
    .card:hover img { transform: scale(1.02); }

    .card-dl {
        position: absolute;
        top: 8px; right: 8px;
        width: 30px; height: 30px;
        display: grid;
        place-items: center;
        border: none;
        border-radius: 50%;
        background: rgba(0, 0, 0, .55);
        color: #fff;
        font-size: .72rem;
        cursor: pointer;
        opacity: 0;
        transform: scale(.8);
        backdrop-filter: blur(6px);
        transition: opacity .2s, transform .2s, background .2s;
    }
    .card:hover .card-dl { opacity: 1; transform: scale(1); }
    .card-dl:hover { background: var(--accent); }
    @media (hover: none) {
        .card-dl { opacity: .9; transform: none; }
    }

    .gallery-loading {
        display: none;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 14px;
        border-top: 1px solid var(--border);
        font-size: .8rem;
        color: var(--dim);
    }
    .gallery-loading i { color: var(--accent); }

    /* ---------- 灯箱 ---------- */
    .lightbox {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(5, 5, 9, .93);
        backdrop-filter: blur(10px);
        opacity: 0;
        visibility: hidden;
        transition: opacity .25s ease, visibility .25s ease;
    }
    .lightbox.open { opacity: 1; visibility: visible; }

    #lbImage {
        max-width: min(92vw, 1400px);
        max-height: 84vh;
        object-fit: contain;
        border-radius: 10px;
        opacity: 0;
        transform: scale(.96);
        box-shadow: 0 30px 80px rgba(0, 0, 0, .7);
        transition: opacity .3s ease, transform .3s cubic-bezier(.34, 1.2, .64, 1);
    }
    #lbImage.loaded { opacity: 1; transform: scale(1); }

    .lb-close,
    .lb-nav {
        position: absolute;
        display: grid;
        place-items: center;
        border: 1px solid rgba(255, 255, 255, .12);
        border-radius: 50%;
        background: rgba(255, 255, 255, .07);
        color: #fff;
        cursor: pointer;
        backdrop-filter: blur(10px);
        transition: background .2s, transform .2s;
    }
    .lb-close:hover,
    .lb-nav:hover { background: rgba(var(--accent-rgb), .35); }

    .lb-close {
        top: 18px; right: 18px;
        width: 40px; height: 40px;
        font-size: .95rem;
    }
    .lb-nav {
        top: 50%;
        width: 46px; height: 46px;
        transform: translateY(-50%);
        font-size: 1rem;
    }
    .lb-nav:active { transform: translateY(-50%) scale(.92); }
    .lb-prev { left: 18px; }
    .lb-next { right: 18px; }

    .lb-bar {
        position: absolute;
        bottom: 22px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 6px 8px 6px 18px;
        border: 1px solid rgba(255, 255, 255, .1);
        border-radius: 99px;
        background: rgba(255, 255, 255, .07);
        backdrop-filter: blur(10px);
        font-size: .82rem;
    }
    .lb-download {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 7px 14px;
        border: none;
        border-radius: 99px;
        background: var(--accent);
        color: #fff;
        font-family: inherit;
        font-size: .78rem;
        font-weight: 600;
        cursor: pointer;
        transition: background .2s;
    }
    .lb-download:hover { background: var(--accent-dark); }

    @media (max-width: 560px) {
        body { padding: 22px 12px 48px; }
        .app-header h1 { font-size: 1.25rem; }
        .btn-query { flex: 1 1 100%; justify-content: center; }
        .format-group { order: 2; }
        .lb-nav { width: 38px; height: 38px; }
        .lb-prev { left: 8px; }
        .lb-next { right: 8px; }
        .lb-close { top: 12px; right: 12px; }
    }

    @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
            animation-duration: .01ms !important;
            transition-duration: .01ms !important;
        }
    }
</style>
</head>
<body>

<main class="container">
    <header class="app-header">
        <div class="icon-wrap"><i class="fas fa-images"></i></div>
        <h1>Pixiv 图集</h1>
    </header>

    <form class="search-bar" id="searchForm" autocomplete="off" novalidate>
        <div class="input-wrap">
            <i class="fas fa-fingerprint"></i>
            <input id="pidInput" type="text" inputmode="numeric"
                   placeholder="输入作品 ID" aria-label="作品 ID" autofocus />
        </div>

        <div class="format-group" role="radiogroup" aria-label="图片格式">
            <label class="format-option">
                <input type="radio" name="imgFormat" value="png" checked /><span>png</span>
            </label>
            <label class="format-option">
                <input type="radio" name="imgFormat" value="jpg" /><span>jpg</span>
            </label>
            <label class="format-option">
                <input type="radio" name="imgFormat" value="gif" /><span>gif</span>
            </label>
        </div>

        <button type="submit" class="btn-query" id="queryBtn">
            <i class="fas fa-bolt"></i><span>获取</span>
        </button>
    </form>

    <section class="stage">
        <div class="placeholder" id="placeholder">
            <i class="fas fa-images"></i>
            <span>输入作品 ID 获取图集</span>
        </div>

        <div class="loading-state" id="loadingState" style="display:none;">
            <div class="spinner"></div>
            <span id="loadingText">侦测中…</span>
        </div>

        <div class="error-state" id="errorState" style="display:none;">
            <i class="fas fa-exclamation-triangle"></i>
            <span id="errorText">加载失败</span>
        </div>

        <div class="gallery" id="gallery" style="display:none;">
            <div class="gallery-bar">
                <span id="galleryCount">0 张</span>
                <button type="button" class="btn-ghost" id="downloadAllBtn">
                    <i class="fas fa-download"></i> 全部下载
                </button>
            </div>
            <div class="grid" id="grid"></div>
            <div class="gallery-loading" id="galleryLoading">
                <i class="fas fa-spinner fa-spin"></i>
                <span id="galleryLoadingText">加载中…</span>
            </div>
        </div>
    </section>
</main>

<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="图片预览">
    <button class="lb-close" id="lbClose" aria-label="关闭"><i class="fas fa-times"></i></button>
    <button class="lb-nav lb-prev" id="lbPrev" aria-label="上一张"><i class="fas fa-chevron-left"></i></button>
    <img id="lbImage" alt="" />
    <button class="lb-nav lb-next" id="lbNext" aria-label="下一张"><i class="fas fa-chevron-right"></i></button>
    <div class="lb-bar">
        <span id="lbCounter">1 / 1</span>
        <button class="lb-download" id="lbDownload"><i class="fas fa-download"></i> 下载</button>
    </div>
</div>

<script>
(function () {
    'use strict';

    const $ = (id) => document.getElementById(id);

    const form            = $('searchForm');
    const pidInput        = $('pidInput');
    const queryBtn        = $('queryBtn');
    const placeholder     = $('placeholder');
    const loadingState    = $('loadingState');
    const loadingText     = $('loadingText');
    const errorState      = $('errorState');
    const errorText       = $('errorText');
    const gallery         = $('gallery');
    const grid            = $('grid');
    const galleryCount    = $('galleryCount');
    const galleryLoading  = $('galleryLoading');
    const galleryLoadingText = $('galleryLoadingText');
    const downloadAllBtn  = $('downloadAllBtn');

    const lightbox  = $('lightbox');
    const lbImage   = $('lbImage');
    const lbCounter = $('lbCounter');
    const lbPrev    = $('lbPrev');
    const lbNext    = $('lbNext');
    const lbClose   = $('lbClose');
    const lbDownload = $('lbDownload');

    const MAX_SEQ = 150;
    const TIMEOUT = 8000;

    let images  = [];
    let cols    = [];
    let session = 0;
    let lbIndex = 0;

    /* ================= 视图状态 ================= */
    function setView(view, message) {
        placeholder.style.display  = view === 'idle'    ? 'flex'  : 'none';
        loadingState.style.display = view === 'loading' ? 'flex'  : 'none';
        errorState.style.display   = view === 'error'   ? 'flex'  : 'none';
        gallery.style.display      = view === 'gallery' ? 'block' : 'none';
        if (view === 'loading' && message) loadingText.textContent = message;
        if (view === 'error'   && message) errorText.textContent   = message;
    }

    /* ================= 瀑布流列 ================= */
    function columnCount() {
        const w = document.querySelector('.container').clientWidth || window.innerWidth;
        return w >= 700 ? 3 : 2;
    }

    function buildColumns(n) {
        grid.innerHTML = '';
        cols = [];
        for (let i = 0; i < n; i++) {
            const c = document.createElement('div');
            c.className = 'col';
            grid.appendChild(c);
            cols.push(c);
        }
    }

    function shortestColumn() {
        let best = cols[0];
        for (let i = 1; i < cols.length; i++) {
            if (cols[i].offsetHeight < best.offsetHeight) best = cols[i];
        }
        return best;
    }

    function appendCard(data, index) {
        const card = document.createElement('div');
        card.className = 'card';

        const img = document.createElement('img');
        img.loading = 'lazy';
        img.decoding = 'async';
        img.alt = '';
        img.addEventListener('load', function () {
            img.classList.add('loaded');
        }, { once: true });
        img.src = data.url;

        const dl = document.createElement('button');
        dl.type = 'button';
        dl.className = 'card-dl';
        dl.title = '下载此图';
        dl.setAttribute('aria-label', '下载此图');
        dl.innerHTML = '<i class="fas fa-download"></i>';
        dl.addEventListener('click', function (e) {
            e.stopPropagation();
            saveImage(data.url, nameOf(data));
        });

        card.appendChild(img);
        card.appendChild(dl);
        card.addEventListener('click', function () { openLightbox(index); });

        shortestColumn().appendChild(card);
    }

    function nameOf(d) {
        return d.pid + '-' + d.seq + '.' + d.format;
    }

    /* ================= 下载 ================= */
    function saveImage(url, filename) {
        fetch(url)
            .then(function (res) {
                if (!res.ok) throw new Error('HTTP ' + res.status);
                return res.blob();
            })
            .then(function (blob) {
                const u = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = u;
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                a.remove();
                setTimeout(function () { URL.revokeObjectURL(u); }, 3000);
            })
            .catch(function () {
                window.open(url, '_blank', 'noopener');
            });
    }

    /* ================= 图片侦测 ================= */
    function testImage(url, isCancelled) {
        return new Promise(function (resolve) {
            if (isCancelled && isCancelled()) return resolve(false);

            const img = new Image();
            let settled = false;

            const timer = setTimeout(function () { finish(false); }, TIMEOUT);

            function finish(ok) {
                if (settled) return;
                settled = true;
                clearTimeout(timer);
                img.onload = img.onerror = null;
                resolve(ok);
            }

            img.onload  = function () { finish(true); };
            img.onerror = function () { finish(false); };
            img.src = url;
        });
    }

    function getFormat() {
        const el = document.querySelector('input[name="imgFormat"]:checked');
        return el ? el.value : 'png';
    }

    async function detect(pid, preferred, onFound, isCancelled) {
        const order = [preferred].concat(
            ['png', 'jpg', 'gif'].filter(function (f) { return f !== preferred; })
        );

        let fmt = null;
        for (let i = 0; i < order.length; i++) {
            if (isCancelled()) return;
            const f = order[i];
            if (await testImage('https://pixiv.re/' + pid + '.' + f, isCancelled)) {
                fmt = f;
                break;
            }
        }

        if (!fmt) throw new Error('未找到该作品，请检查 ID 或换一种格式');

        document.querySelectorAll('input[name="imgFormat"]').forEach(function (r) {
            if (r.value === fmt) r.checked = true;
        });

        onFound({
            pid: pid, seq: 1, format: fmt,
            url: 'https://pixiv.re/' + pid + '.' + fmt
        });

        let fails = 0;
        for (let seq = 2; seq <= MAX_SEQ; seq++) {
            if (isCancelled()) return;
            const url = 'https://pixiv.re/' + pid + '-' + seq + '.' + fmt;
            if (await testImage(url, isCancelled)) {
                onFound({ pid: pid, seq: seq, format: fmt, url: url });
                fails = 0;
            } else if (++fails >= 2) {
                break;
            }
        }
    }

    /* ================= 查询流程 ================= */
    async function performQuery() {
        const pid = pidInput.value.trim();
        if (!pid) {
            pidInput.classList.remove('shake');
            void pidInput.offsetWidth;
            pidInput.classList.add('shake');
            pidInput.focus();
            return;
        }

        const my = ++session;
        const cancelled = function () { return my !== session; };

        images  = [];
        lbIndex = 0;
        buildColumns(columnCount());
        galleryCount.textContent = '';
        galleryLoadingText.textContent = '加载中…';
        galleryLoading.style.display = 'flex';
        queryBtn.disabled = true;
        setView('loading', '正在侦测图片…');

        try {
            await detect(pid, getFormat(), function (data) {
                if (cancelled()) return;

                images.push(data);

                if (images.length === 1) {
                    setView('gallery');
                    galleryLoading.style.display = 'flex';
                }

                appendCard(data, images.length - 1);

                galleryCount.textContent = images.length + ' 张';
                galleryLoadingText.textContent = '已加载 ' + images.length + ' 张…';
            }, cancelled);

            if (cancelled()) return;
            galleryLoading.style.display = 'none';
            galleryCount.textContent = images.length + ' 张';
        } catch (err) {
            if (cancelled()) return;
            if (!images.length) {
                setView('error', (err && err.message) || '加载失败，请稍后重试');
            } else {
                galleryLoading.style.display = 'none';
            }
        } finally {
            if (!cancelled()) queryBtn.disabled = false;
        }
    }

    /* ================= 灯箱 ================= */
    function openLightbox(i) {
        if (!images[i]) return;
        lbIndex = i;
        renderLightbox();
        lightbox.classList.add('open');
        document.body.style.overflow = 'hidden';
    }

    function closeLightbox() {
        lightbox.classList.remove('open');
        document.body.style.overflow = '';
        lbImage.classList.remove('loaded');
        lbImage.removeAttribute('src');
    }

    function renderLightbox() {
        const d = images[lbIndex];
        if (!d) return;

        lbImage.classList.remove('loaded');
        lbImage.onload = function () { lbImage.classList.add('loaded'); };
        lbImage.src = d.url;
        if (lbImage.complete) lbImage.classList.add('loaded');

        lbCounter.textContent = (lbIndex + 1) + ' / ' + images.length;

        const multi = images.length > 1;
        lbPrev.style.display = multi ? '' : 'none';
        lbNext.style.display = multi ? '' : 'none';
    }

    function stepLightbox(dir) {
        const n = images.length;
        if (!n) return;
        lbIndex = (lbIndex + dir + n) % n;
        renderLightbox();
    }

    /* ================= 事件 ================= */
    form.addEventListener('submit', function (e) {
        e.preventDefault();
        performQuery();
    });

    downloadAllBtn.addEventListener('click', function () {
        if (!images.length) return;
        if (!confirm('下载全部 ' + images.length + ' 张图片？')) return;
        images.forEach(function (d, i) {
            setTimeout(function () { saveImage(d.url, nameOf(d)); }, i * 320);
        });
    });

    lbClose.addEventListener('click', closeLightbox);
    lbPrev.addEventListener('click', function (e) { e.stopPropagation(); stepLightbox(-1); });
    lbNext.addEventListener('click', function (e) { e.stopPropagation(); stepLightbox(1); });
    lbDownload.addEventListener('click', function (e) {
        e.stopPropagation();
        const d = images[lbIndex];
        if (d) saveImage(d.url, nameOf(d));
    });

    lightbox.addEventListener('click', function (e) {
        if (e.target === lightbox) closeLightbox();
    });

    document.addEventListener('keydown', function (e) {
        if (!lightbox.classList.contains('open')) return;
        if (e.key === 'Escape') closeLightbox();
        else if (e.key === 'ArrowLeft') stepLightbox(-1);
        else if (e.key === 'ArrowRight') stepLightbox(1);
    });

    let resizeTimer;
    window.addEventListener('resize', function () {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(function () {
            const n = columnCount();
            if (n === cols.length) return;
            const cards = Array.prototype.slice.call(grid.querySelectorAll('.card'));
            buildColumns(n);
            cards.forEach(function (c) { shortestColumn().appendChild(c); });
        }, 200);
    });

    /* ================= 初始化 ================= */
    buildColumns(columnCount());
    setView('idle');
})();
</script>
</body>
</html>
